<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django Auth{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/jpeg" href="{% static 'reg/images/logo.jpg' %}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
        crossorigin="anonymous">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
        }

        /* Prevent content from becoming too wide */
        .auth-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Make form controls fit their container */
        input,
        select,
        textarea {
            max-width: 100%;
        }

        /* Slightly tighter spacing on small screens */
        @media (max-width: 576px) {
            .auth-container {
                padding: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <main class="container-fluid py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkkQ2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>
</html>
